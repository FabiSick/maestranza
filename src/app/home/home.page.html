<ion-menu contentId="main-content" type="overlay">
  <ion-header>
    <ion-toolbar color="primary">
      <ion-title>Menú Principal</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list>
      <!-- Configuraciones -->
      <ion-list-header>
        <ion-label class="section-title">⚙️ Configuraciones</ion-label>
      </ion-list-header>
      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/proveedores" routerDirection="root">
          <ion-icon name="business-outline" slot="start"></ion-icon>
          <ion-label>Proveedores</ion-label>
        </ion-item>
        <ion-item routerLink="/etiquetado" routerDirection="root">
          <ion-icon name="pricetag-outline" slot="start"></ion-icon>
          <ion-label>Etiquetado</ion-label>
        </ion-item>
        <ion-item routerLink="/integracion-compras" routerDirection="root">
          <ion-icon name="cart-outline" slot="start"></ion-icon>
          <ion-label>Integración Compras</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <!-- Alertas -->
      <ion-list-header>
        <ion-label class="section-title">⚠️ Alertas</ion-label>
      </ion-list-header>
      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/alertas-stock" routerDirection="root">
          <ion-icon name="alert-circle-outline" slot="start"></ion-icon>
          <ion-label>Stock Bajo</ion-label>
        </ion-item>
        <ion-item routerLink="/lotes-vencimiento" routerDirection="root">
          <ion-icon name="time-outline" slot="start"></ion-icon>
          <ion-label>Lotes Vencimiento</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <!-- Cuenta -->
      <ion-list-header>
        <ion-label class="section-title">🔒 Cuenta</ion-label>
      </ion-list-header>
      <ion-item button (click)="logout()">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        <ion-label>Cerrar sesión</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>

    <ion-title class="logo-header">
      <img src="assets/imgs/Maestranza-logo.png" alt="Maestranza Unidos S.A." />
    </ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="mostrarPopover($event)">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
        <ion-badge *ngIf="notificaciones.length" color="danger" class="notif-badge">
          {{ notificaciones.length }}
        </ion-badge>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>



<ion-content class="ion-padding" id="main-content">

  <div class="card-grid">
    <ion-card button routerLink="/registro-inventario" class="card-button">
      <ion-icon name="cube-outline" class="card-icon"></ion-icon>
      <ion-label>Inventario</ion-label>
    </ion-card>

    <ion-card button routerLink="/movimientos" class="card-button">
      <ion-icon name="swap-horizontal-outline" class="card-icon"></ion-icon>
      <ion-label>Movimientos</ion-label>
    </ion-card>

    <ion-card button routerLink="/kits" class="card-button">
      <ion-icon name="construct-outline" class="card-icon"></ion-icon>
      <ion-label>Kits</ion-label>
    </ion-card>

    <ion-card button routerLink="/reportes" class="card-button">
      <ion-icon name="document-text-outline" class="card-icon"></ion-icon>
      <ion-label>Reportes</ion-label>
    </ion-card>

    <ion-card button routerLink="/historial-precios" class="card-button">
      <ion-icon name="pricetags-outline" class="card-icon"></ion-icon>
      <ion-label>Precios</ion-label>
    </ion-card>

    <ion-card button routerLink="/alertas-stock" class="card-button">
      <ion-icon name="alert-circle-outline" class="card-icon"></ion-icon>
      <ion-label>Alertas</ion-label>
    </ion-card>

    <ion-card button routerLink="/proveedores" class="card-button">
      <ion-icon name="business-outline" class="card-icon"></ion-icon>
      <ion-label>Proveedores</ion-label>
    </ion-card>

    <ion-card button routerLink="/etiquetado" class="card-button">
      <ion-icon name="barcode-outline" class="card-icon"></ion-icon>
      <ion-label>Etiquetado</ion-label>
    </ion-card>
  </div>

</ion-content>
