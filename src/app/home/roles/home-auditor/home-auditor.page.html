<ion-menu side="start" content-id="main-content">
  <ion-header><ion-toolbar color="primary"><ion-title>Menú</ion-title></ion-toolbar></ion-header>
  <ion-content>
    <ion-list>
      <ion-list-header class="section-title">⚙️ Gestión</ion-list-header>
      <ion-item routerLink="/proveedores">🏢 Proveedores</ion-item>
      <ion-item routerLink="/integracion-compras">🛒 Órdenes de Compra</ion-item>
      <ion-list-header class="section-title">🔒 Cuenta</ion-list-header>
      <ion-item button (click)="logout()">🚪 Cerrar sesión</ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>

    <ion-title class="logo-header">
      <img src="assets/imgs/Maestranza-logo.png" alt="Maestranza Unidos S.A." />
    </ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="mostrarPopover($event)">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
        <ion-badge *ngIf="notificaciones.length" color="danger" class="notif-badge">
          {{ notificaciones.length }}
        </ion-badge>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content id="main-content" class="ion-padding">
  <ion-list>
    <ion-list-header><ion-label>📋 Funciones</ion-label></ion-list-header>
    <ion-item button routerLink="/registro-inventario">📊 Auditoría de Inventario</ion-item>
    <ion-item button routerLink="/reportes">📄 Reportes</ion-item>
  </ion-list>
</ion-content>
