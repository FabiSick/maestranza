<ion-menu contentId="main-content" type="overlay">
  <ion-header>
    <ion-toolbar color="primary">
      <ion-title>Menú Principal</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-list-header class="section-title">⚙️ Configuraciones</ion-list-header>
      <ion-item routerLink="/integracion-compras">🛒 Aprovisionamiento</ion-item>

      <ion-list-header class="section-title">⚠️ Alertas</ion-list-header>
      <ion-item routerLink="/alertas-stock">📉 Stock Bajo</ion-item>
      <ion-item routerLink="/lotes-vencimiento">⏳ Lotes Vencimiento</ion-item>

      <ion-list-header class="section-title">🔒 Cuenta</ion-list-header>
      <ion-item button (click)="logout()">🚪 Cerrar sesión</ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>

    <ion-title class="logo-header">
      <img src="assets/imgs/Maestranza-logo.png" alt="Maestranza Unidos S.A." />
    </ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="mostrarPopover($event)">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
        <ion-badge *ngIf="notificaciones.length" color="danger" class="notif-badge">
          {{ notificaciones.length }}
        </ion-badge>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content id="main-content" class="ion-padding">
  <ion-list>
    <ion-list-header><ion-label class="section-title">🔧 Inventario</ion-label></ion-list-header>
    <ion-item button routerLink="/registro-inventario">📦 Registro</ion-item>
    <ion-item button routerLink="/movimientos">🔄 Movimientos</ion-item>
  </ion-list>
</ion-content>
