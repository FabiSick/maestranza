<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Historial de precios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list *ngIf="historialPrecios.length > 0">
    <ion-item *ngFor="let h of historialPrecios">
      <ion-label>
        <h2>{{ h.nombre }}</h2>
        <p>Precio actual: ${{ h.precio }}</p>
        <ion-badge [color]="h.cambio === 'subió' ? 'danger' : h.cambio === 'bajó' ? 'success' : 'medium'">
          Precio {{ h.cambio }}
        </ion-badge>
      </ion-label>
    </ion-item>
  </ion-list>

  <div *ngIf="historialPrecios.length === 0" class="ion-text-center">
    <p>No hay datos de precios disponibles.</p>
  </div>
</ion-content>
