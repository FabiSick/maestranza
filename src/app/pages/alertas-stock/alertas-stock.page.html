<ion-header>
  <ion-toolbar color="danger">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Alertas de Stock</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list *ngIf="alertas.length > 0">
    <ion-item *ngFor="let producto of alertas">
      <ion-label>
        <h2>{{ producto.nombre }}</h2>
        <p>Código: {{ producto.codigo }} | {{ producto.categoria }}</p>
        <p>Ubicación: {{ producto.ubicacion }}</p>
        <p>
          <strong>Stock:</strong> {{ producto.cantidad }} {{ producto.unidad }}<br>
          <strong>Mínimo:</strong> {{ producto.stockMinimo }}
        </p>
      </ion-label>
      <ion-badge color="danger" slot="end">Bajo</ion-badge>
    </ion-item>
  </ion-list>

  <div *ngIf="alertas.length === 0" class="ion-text-center">
    <ion-icon name="checkmark-circle-outline" size="large"></ion-icon>
    <p>No hay alertas de stock</p>
  </div>

</ion-content>
