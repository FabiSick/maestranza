<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Movimientos de Inventario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list *ngIf="movimientos.length > 0">
    <ion-item *ngFor="let m of movimientos">
      <ion-label>
        <h2>{{ m.tipo | titlecase }} - {{ m.cantidad }}</h2>
        <p>Producto ID: {{ m.productoId }}<br>Usuario: {{ m.usuario }}<br>Fecha: {{ m.fecha | date:'short' }}</p>
      </ion-label>
      <ion-badge slot="end" color="medium">{{ m.motivo }}</ion-badge>
    </ion-item>
  </ion-list>

  <div *ngIf="movimientos.length === 0" class="empty-state">
    <ion-icon name="document-text-outline"></ion-icon>
    <p>No hay movimientos registrados</p>
  </div>
</ion-content>
